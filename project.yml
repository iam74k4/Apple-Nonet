# Xcode プロジェクトは XcodeGen で作る: `xcodegen generate`（Nonet.xcodeproj はコミットしない）
name: Nonet
options:
  bundleIdPrefix: com.iam74k4
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: ja
  createIntermediateGroups: true
configFiles:
  Debug: Config/Nonet.xcconfig
  Release: Config/Nonet.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: NL9ZXK2SGR
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  NonetKit:
    path: Packages/NonetKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  Nonet:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: NonetKit
        product: NonetCore
      - package: NonetKit
        product: NonetPlatform
      - package: NonetKit
        product: NonetUI
      - package: Sparkle
        product: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Nonet
        CFBundleDisplayName: Nonet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Takanari Okazaki"
        NSAppleEventsUsageDescription: "スクリプトに渡す情報（表示中のページや書類の場所）を取得し、ターミナルでコマンドを実行するために使います。"
        SUFeedURL: $(NONET_APPCAST_URL)
        SUPublicEDKey: $(NONET_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        NonetPurchaseURL: $(NONET_PURCHASE_URL)
        NonetSupportURL: $(NONET_SUPPORT_URL)
        NonetPrivacyURL: $(NONET_PRIVACY_URL)
        NonetLicensePublicKey: $(NONET_LICENSE_PUBLIC_KEY)
    entitlements:
      path: App/Nonet.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iam74k4.Nonet
        PRODUCT_NAME: Nonet
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
schemes:
  Nonet:
    build:
      targets:
        Nonet: all
    run:
      config: Debug
    archive:
      config: Release
